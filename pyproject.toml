[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantity-guard"
dynamic = ["version"]
description = "Typed physical quantities at the AI agent tool boundary: units, vertical datums, timezones, and record quality, enforced at call time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agents", "units", "mcp", "tool-calling", "hydrology", "engineering"]
authors = [{ name = "Kayode Adeniyi" }]
dependencies = ["pint>=0.23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.scripts]
quantity-guard-mcp = "quantity_guard.proxy:main"

[project.optional-dependencies]
arrays = ["numpy>=1.24"]
dev = ["pytest>=8.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Adeniyikayodee/quantity-guard"
Issues = "https://github.com/Adeniyikayodee/quantity-guard/issues"

[tool.hatch.version]
path = "src/quantity_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantity_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the USGS service; excluded by default"]
